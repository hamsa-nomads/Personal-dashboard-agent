name: Bootstrap Dayframe

on:
  push:
    paths:
      - bootstrap/READY

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and unpack validated application
        run: |
          cat bootstrap/chunk-* | base64 --decode > /tmp/dayframe.zip
          unzip -o /tmp/dayframe.zip -d .
          rm -rf bootstrap
      - name: Commit application tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add Dayframe personal dashboard agent"
            git push
          fi
